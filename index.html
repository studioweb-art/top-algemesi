function render(){
  const q = document.getElementById("q").value.toLowerCase();
  let r = S.filter(s => (f==="todos" || catDe(s)===f) && (s.n.toLowerCase().includes(q) || s.tipo.toLowerCase().includes(q)));
  r = r.slice().sort((a,b) => (FEAT.includes(b.n)-FEAT.includes(a.n)) || (o==="ops" ? (nOps(b.n)-nOps(a.n)) : o==="mas" ? ((avg(b)-avg(a)) || (nOps(b.n)-nOps(a.n))) : o==="menos" ? (((avg(a)||6)-(avg(b)||6)) || a.n.localeCompare(b.n,"es")) : a.n.localeCompare(b.n,"es")));
  document.getElementById("count").textContent = r.length + " negocios";
  document.getElementById("list").innerHTML = r.map(s => {
    const id = s.n; const revs = getRevs(id); const dest = FEAT.includes(s.n);
    const qn = esc(s.n).replace(/'/g,"\'");
    return '<div class="card' + (dest?" dest":"") + '"><div class="pic">' + icoDe(s) + '<img src="' + picDe(s) + '" alt="" loading="lazy" onerror="this.remove()"><span class="pbadge">' + esc(s.tipo) + '</span></div>'
    + '<div class="body"><h2>' + esc(s.n) + '</h2>' + (dest?'<span class="star">⭐ Destacado</span>':"")
    + (s.dir?'<div class="meta">📍 ' + esc(s.dir) + ', Algemesí</div>':"")
    + '<div class="meta"><a style="color:#7cb342;" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(s.n + (s.dir?", "+s.dir:"") + ", Algemesí") + '">🧭 Cómo llegar</a></div>'
    + '<div class="ops">' + (revs.length ? starGlyph(avg(s)) + " " + avg(s).toFixed(1) + " · 💬 " + revs.length : "Nuevo · ¡sé el primero en opinar!") + ' · <a style="color:#7cb342;" target="_blank" rel="noopener" href="https://wa.me/?text=' + encodeURIComponent("Mira " + s.n + " en Guía Algemesí: https://studioweb-art.github.io/top-algemesi/") + '">🔗 Compartir</a></div>' + socialRow(s)
    + '<div class="actions">' + (s.tel?'<a class="b-call" href="' + telHref(s.tel) + '">📞 Llamar</a>':'<a class="b-call" href="#contacto">✏️ ¿Es tu negocio?</a>')
    + '<button class="b-op" onclick="document.getElementById(\'f_' + qn + '\').scrollIntoView({behavior:\'smooth\',block:\'center\'})">✍️ Opinar</button></div>'
    + '<div class="revs">' + revs.map(v=>'<div class="rev"><b>' + esc(v.n) + ' · ' + "★".repeat(v.s) + '</b>' + esc(v.t) + '</div>').join("") + '</div>'
    + '<div class="revform" id="f_' + qn + '">'
    + '<input id="n_' + qn + '" placeholder="Tu nombre">'
    + '<select id="s_' + qn + '"><option value="5">★★★★★ (5)</option><option value="4">★★★★ (4)</option><option value="3">★★★ (3)</option><option value="2">★★ (2)</option><option value="1">★ (1)</option></select>'
    + '<textarea id="t_' + qn + '" rows="2" placeholder="¿Qué te pareció?"></textarea>'
    + '<button onclick="opinar(\'' + qn + '\')">Publicar opinión</button>'
    + '</div></div></div>';
  }).join("");
}
function opinar(id){
  const g = x => document.getElementById(x+"_"+id);
  const n = g("n").value.trim() || "Anónimo";
  const s = parseInt(g("s").value);
  const t = g("t").value.trim();
  if(!t){ alert("Escribe tu opinión primero 🙂"); return; }
  const revs = getRevs(id); revs.unshift({n:n, s:s, t:t});
  localStorage.setItem("rev_"+id, JSON.stringify(revs));
  render();
}
document.getElementById("q").addEventListener("input", render);
document.getElementById("orden").addEventListener("change", e => { o = e.target.value; render(); });
document.querySelectorAll("#chips button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll("#chips button").forEach(x => x.classList.remove("on"));
  b.classList.add("on"); f = b.dataset.t; render();
}));
render();
</script>
</body>
