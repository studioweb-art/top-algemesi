const FEAT = ["Mirandas", "Trencadís"];
function esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function telHref(t){ let d = t.replace(/[^+\d]/g, ""); if(d && !d.startsWith("+")) d = "+34" + d; return "tel:" + d; }
function getRevs(id){ try { return JSON.parse(localStorage.getItem("rev_"+id) || "[]"); } catch(e){ return []; } }
let f = "todos";
function render(){
  const q = document.getElementById("q").value.toLowerCase();
  let r = S.filter(s => (f==="todos" || s.t===f) && (s.n.toLowerCase().includes(q) || s.tipo.toLowerCase().includes(q)));
  r = r.slice().sort((a,b) => (FEAT.includes(b.n)-FEAT.includes(a.n)) || a.n.localeCompare(b.n,"es"));
  document.getElementById("count").textContent = r.length + " negocios";
  document.getElementById("list").innerHTML = r.map(s => {
    const id = s.n; const revs = getRevs(id); const dest = FEAT.includes(s.n);
    return `<div class="card${dest?" dest":""}"><h2>${esc(s.n)}</h2><span class="tipo">${esc(s.tipo)}</span>${dest?`<span class="star">⭐ Destacado</span>`:""}
    ${s.dir?`<div class="meta">📍 ${esc(s.dir)}, Algemesí</div>`:""}
    <div class="ops">${revs.length ? "💬 " + revs.length + " opiniones" : "Nuevo · ¡sé el primero en opinar!"}</div>
    <div class="actions">${s.tel?`<a class="b-call" href="${telHref(s.tel)}">📞 ${esc(s.tel)}</a>`:""}
    <button class="b-op" onclick="document.getElementById('f_${esc(s.n)}').scrollIntoView({behavior:'smooth',block:'center'})">✍️ Opinar</button></div>
    <div class="revs">${revs.map((v,idx)=>`<div class="rev"><b>${esc(v.n)} · ${"★".repeat(v.s)}</b>${esc(v.t)}<br><a href="#" onclick="borrar('${esc(s.n).replace(/'/g,"\\'")}',${idx});return false;" style="color:#c0392b;font-size:12px;">🗑️ Borrar</a></div>`).join("")}</div>
    <div class="revform" id="f_${esc(s.n)}">
      <input id="n_${esc(s.n)}" placeholder="Tu nombre">
      <select id="s_${esc(s.n)}"><option value="5">★★★★★ (5)</option><option value="4">★★★★ (4)</option><option value="3">★★★ (3)</option><option value="2">★★ (2)</option><option value="1">★ (1)</option></select>
      <textarea id="t_${esc(s.n)}" rows="2" placeholder="¿Qué te pareció?"></textarea>
      <button onclick="opinar('${esc(s.n).replace(/'/g,"\'")}')">Publicar opinión</button>
    </div></div>`;
  }).join("");
}
function opinar(id){
  const g = x => document.getElementById(x+"_"+id);
  const n = g("n").value.trim() || "Anónimo";
  const s = parseInt(g("s").value);
  const t = g("t").value.trim();
  if(!t){ alert("Escribe tu opinión primero 🙂"); return; }
  const revs = getRevs(id); revs.unshift({n:n, s:s, t:t});
  localStorage.setItem("rev_"+id, JSON.stringify(revs));
  render();
}
function borrar(id, idx){
  const revs = getRevs(id); revs.splice(idx, 1);
  localStorage.setItem("rev_"+id, JSON.stringify(revs));
  render();
}
document.getElementById("q").addEventListener("input", render);
document.querySelectorAll("#chips button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll("#chips button").forEach(x => x.classList.remove("on"));
  b.classList.add("on"); f = b.dataset.t; render();
}));
render();
